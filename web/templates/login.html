{{template "base" .}}
{{define "content"}}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-tabs">
            <button class="auth-tab active" onclick="showTab('login', event)">Log In</button>
            <button class="auth-tab" onclick="showTab('register', event)">Register</button>
        </div>

        <div id="login-form">
            <div class="form-group">
                <input type="email" id="login-email" placeholder="Email" autocomplete="email" />
            </div>
            <div class="form-group">
                <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" />
            </div>
            <button class="btn-primary full-width" onclick="login()">Log In</button>
            <p id="login-error" class="form-error"></p>
        </div>

        <div id="register-form" style="display:none">
            <div class="form-group">
                <input type="text" id="reg-username" placeholder="Username" autocomplete="username" />
            </div>
            <div class="form-group">
                <input type="email" id="reg-email" placeholder="Email" autocomplete="email" />
            </div>
            <div class="form-group">
                <input type="password" id="reg-password" placeholder="Password" autocomplete="new-password" />
            </div>
            <button class="btn-primary full-width" onclick="register()">Create Account</button>
            <p id="register-error" class="form-error"></p>
        </div>
    </div>
</div>

<script>
function showTab(tab, event) {
    document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
    document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
}

async function login() {
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    errorEl.textContent = '';

    const res = await fetch('/api/login', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({email, password})
    });

    if (res.ok) {
        const data = await res.json();
        localStorage.setItem('token', data.token);
        window.location.href = '/game';
    } else {
        errorEl.textContent = 'Invalid email or password';
    }
}

async function register() {
    const username = document.getElementById('reg-username').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const errorEl = document.getElementById('register-error');
    errorEl.textContent = '';

    const res = await fetch('/api/register', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({username, email, password})
    });

    if (res.ok) {
        const data = await res.json();
        localStorage.setItem('token', data.token);
        window.location.href = '/game';
    } else {
        errorEl.textContent = 'Registration failed. Try a different email or username.';
    }
}
</script>
{{end}}
